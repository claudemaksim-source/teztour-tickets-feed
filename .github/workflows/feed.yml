name: Обновить цены

on:
  schedule:
    - cron: "17 3 * * *"      # каждый день в 03:17 UTC
  workflow_dispatch:           # и по кнопке вручную
  push:
    # только изменения кода. Файлы цен и запас сюда не включены
    # намеренно: иначе коммит бота запускал бы сборку без конца
    paths:
      - build-feed.py
      - program.py
      - checks.py
      - cms.py
      - .github/workflows/feed.yml

permissions:
  contents: write

# два прогона разом полезли бы друг другу в push и в запас
concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # обычный прогон — около 16 минут (1900 запросов по 2 в секунду),
    # но первый с пустым запасом идёт по всей сетке — около 43 минут
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Собрать фид
        run: python3 build-feed.py

      - name: Собрать файлы для Framer CMS
        run: python3 cms.py

      - name: Закоммитить, если цены изменились
        if: always()          # запас пишется и при отказе публикации
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          # через индекс, а не git diff: неотслеживаемый файл diff не видит,
          # и самый первый запуск решил бы, что изменений нет
          git add tickets-from.json prices-cache.json \
                  cms-regions.json cms-countries.json
          if git diff --cached --quiet; then
            echo "изменений нет"
            exit 0
          fi
          git commit -m "цены на $(date -u +%F)"
          git push

      # Сверка идёт здесь, а не отдельным расписанием, именно потому,
      # что так нет разрыва во времени: фид только что закоммичен,
      # и не надо угадывать, успела ли сборка к назначенному часу.
      #
      # Ключ — из секрета, а не в теле файла: хранилище публичное.
      # Без секрета шаг пропускается с пометкой, а не валит сборку:
      # цены важнее сверки, и фид должен обновляться даже без неё.
      - name: Сверить коллекцию tickets в Framer CMS
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "секрет SUPABASE_ANON_KEY не задан — сверка пропущена"
            exit 0
          fi
          url="https://sjzrnrrndgxvdartjkgw.supabase.co/functions/v1/framer-tickets?mode=sync"
          out=$(curl -sS -m 280 "$url" \
                  -H "apikey: $SUPABASE_ANON_KEY" \
                  -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "$out"
          # ответ с ok:true считаем удачей, иначе роняем шаг, чтобы GitHub
          # прислал письмо: молчаливая несверка хуже шумной
          echo "$out" | python3 -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('ok') else 1)"
