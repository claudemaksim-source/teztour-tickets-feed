name: Обновить цены

on:
  schedule:
    - cron: "17 3 * * *"      # каждый день в 03:17 UTC
  workflow_dispatch:           # и по кнопке вручную

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Собрать фид
        run: python3 build-feed.py

      - name: Закоммитить, если цены изменились
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          if git diff --quiet -- tickets-from.json; then
            echo "изменений нет"
            exit 0
          fi
          # generated_at меняется каждый день, поэтому сверяем только данные
          before=$(git show HEAD:tickets-from.json \
                   | python3 -c "import json,sys; d=json.load(sys.stdin); d.pop('generated_at',None); print(json.dumps(d,sort_keys=True))" 2>/dev/null || echo "")
          after=$(python3 -c "import json; d=json.load(open('tickets-from.json')); d.pop('generated_at',None); print(json.dumps(d,sort_keys=True))")
          if [ "$before" = "$after" ]; then
            echo "изменилась только дата сборки — не коммитим"
            git checkout -- tickets-from.json
            exit 0
          fi
          git add tickets-from.json
          git commit -m "цены на $(date -u +%F)"
          git push
