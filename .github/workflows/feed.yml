name: Обновить цены

on:
  schedule:
    - cron: "17 3 * * *"      # каждый день в 03:17 UTC
  workflow_dispatch:           # и по кнопке вручную
  push:
    # только изменения кода. Файлы цен и запас сюда не включены
    # намеренно: иначе коммит бота запускал бы сборку без конца
    paths:
      - build-feed.py
      - program.py
      - checks.py
      - cms.py
      - .github/workflows/feed.yml

permissions:
  contents: write

# два прогона разом полезли бы друг другу в push и в запас
concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # обычный прогон — около 16 минут (1900 запросов по 2 в секунду),
    # но первый с пустым запасом идёт по всей сетке — около 43 минут
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Собрать фид
        run: python3 build-feed.py

      - name: Собрать файлы для Framer CMS
        run: python3 cms.py

      - name: Закоммитить, если цены изменились
        if: always()          # запас пишется и при отказе публикации
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          # через индекс, а не git diff: неотслеживаемый файл diff не видит,
          # и самый первый запуск решил бы, что изменений нет
          git add tickets-from.json prices-cache.json \
                  cms-regions.json cms-countries.json
          if git diff --cached --quiet; then
            echo "изменений нет"
            exit 0
          fi
          git commit -m "цены на $(date -u +%F)"
          git push

      # Было: при отсутствии секрета шаг молча выходил с нулём, и пропуск
      # сверки выглядел точно как удачная сверка. Коллекция простояла пять
      # дней с ценами на треть выше настоящих, и признака этого не было
      # нигде. Теперь отсутствие секрета роняет шаг: цены к этому моменту
      # уже закоммичены предыдущим шагом, то есть фид не страдает, а GitHub
      # присылает письмо о падении.
      #
      # Разбор ответа — только однострочным python. Многострочный внутри
      # "run: |" пришлось бы писать без отступа, а строка без отступа
      # обрывает блок YAML, и файл перестаёт разбираться целиком.
      - name: Сверить коллекцию tickets в Framer CMS
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::секрет SUPABASE_ANON_KEY не задан — коллекция в CMS не обновляется"
            exit 1
          fi
          url="https://sjzrnrrndgxvdartjkgw.supabase.co/functions/v1/framer-tickets?mode=sync"
          out=$(curl -sS -m 280 "$url" -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "$out"
          get() { echo "$out" | python3 -c "import json,sys;print(json.load(sys.stdin).get('$1'))"; }
          ok=$(get ok)
          day=$(get generated_at)
          n=$(get written)
          want=$(python3 -c "import json;print(json.load(open('tickets-from.json'))['generated_at'])")
          # сверяем не только ok, но и дату: иначе удачным сочтётся прогон,
          # записавший в CMS вчерашний фид
          if [ "$ok" != "True" ] || [ "$day" != "$want" ] || [ "${n:-0}" -lt 1 ]; then
            echo "::error::сверка не сошлась: ok=$ok дата=$day (ждали $want) записей=$n"
            exit 1
          fi
          echo "в CMS записано $n за $day"
